<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>What is Machine Learning?</title>
  </head>
  <body>
    <div class="scene">
      <p class="step-label" id="step-label">Rules</p>
      <div class="flow" id="flow"></div>
      <div class="match" id="match">
        <div class="match-row"><span class="match-pred">Prediction: Spam</span><span class="match-eq">=</span><span class="match-actual">Actual label: Spam ✓</span></div>
        <div class="match-title">GENERALIZATION</div>
        <div class="match-text">A model generalizes when it performs well on new data it did not train on.</div>
      </div>
      <section class="explain" aria-live="polite">
        <h3 class="explain-h" id="explain-h"></h3>
        <p class="explain-t" id="caption"></p>
      </section>
    </div>
  </body>
</html>
